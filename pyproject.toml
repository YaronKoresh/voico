[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voico"
version = "0.1.0"
description = "Modular Voice Converter"
readme = "README.md"
license = {text = "UCSL-1.0"}
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0"
]

[project.optional-dependencies]
full = ["librosa>=0.9.0"]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.39.0",
    "python-multipart>=0.0.6",
]
dev = [
    "librosa>=0.9.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff",
    "poethepoet",
    "pre-commit",
    "build",
    "pydantic>=2.0.0",
    "mypy>=1.0",
    "vulture>=2.10",
    "websockets>=12.0",
    "briefcase>=0.3.0"
]

[project.scripts]
voico = "voico.main:main"
voico-server = "voico.api._server:main"

[project.urls]
Homepage = "https://github.com/YaronKoresh/voico"
Repository = "https://github.com/YaronKoresh/voico"
Issues = "https://github.com/YaronKoresh/voico/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voico"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/voico --cov-report=term-missing"

[tool.ruff]
target-version = "py39"
line-length = 80

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",
    "E402",
    "B008",
    "B904"
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = ["E731"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poe.tasks]
check = ["clean", "compile", "dead-code", "strip-comments", "pre-commit", "test", "clean"]

[tool.poe.tasks.test]
cmd = "pytest tests/"

[tool.poe.tasks.compile]
cmd = "python -m compileall -q ."

[tool.poe.tasks.lint]
cmd = "ruff check ."

[tool.poe.tasks.pre-commit]
cmd = "pre-commit run --all-files"

[tool.poe.tasks.pre-commit.env]
SKIP = "no-commit-to-branch"

[tool.poe.tasks.clean]
cmd = "python scripts/clean_workspace.py"

[tool.poe.tasks.strip-comments]
cmd = "python scripts/strip_comments.py"

[tool.poe.tasks.build]
cmd = "python -m build"

[tool.poe.tasks.build-wheel]
cmd = "python -m build --wheel"

[tool.poe.tasks.hook]
cmd = "pre-commit install"

[tool.poe.tasks.format]
cmd = "ruff format ."

[tool.poe.tasks.dead-code]
cmd = "vulture src/ --min-confidence 80 --sort-by-size"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.briefcase]
project_name = "voico"
bundle = "io.github.yaronkoresh.voico"
version = "0.1.0"
url = "https://github.com/YaronKoresh/voico"
license = "UCSL-1.0"

[tool.briefcase.app.voico]
formal_name = "Voico"
description = "Modular Voice Converter"
long_description = "Modular Voice Converter"
sources = ["src/voico"]
requires = []

[tool.briefcase.app.voico.macOS]
requires = []

[tool.briefcase.app.voico.linux]
requires = []

[tool.briefcase.app.voico.windows]
requires = []
